<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark: a low sun on the horizon, in the dusk gradient (see .brand-mark in styles.css). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4fd0" />
      <stop offset="0.55" stop-color="#9a63cf" />
      <stop offset="1" stop-color="#e573a3" />
    </linearGradient>
    <clipPath id="tile">
      <rect width="32" height="32" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="url(#sky)" />
    <circle cx="16" cy="25" r="9.5" fill="#fb9b79" />
    <circle cx="16" cy="25" r="6.2" fill="#ffd2b8" />
    <rect y="23" width="32" height="9" fill="#0e101e" fill-opacity="0.55" />
    <rect x="4" y="23" width="24" height="1.2" fill="#0e101e" fill-opacity="0.6" />
  </g>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" />
</svg>
